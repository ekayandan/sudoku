<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Games</title>
  <meta name="description" content="Timeless games that work offline. No ads, no accounts.">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem('app.theme')||localStorage.getItem('sudoku.theme')||'system';if(t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket Games">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="shell.js">
  <link rel="modulepreload" href="shared/input.js">
</head>
<body data-screen="home">
  <!-- HOME -->
  <main id="home" class="screen" hidden>
    <header class="topbar">
      <h1>Pocket Games</h1>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <button id="btn-continue" class="card primary continue" hidden>
      <img id="continue-icon" alt="" width="48" height="48">
      <span class="continue-text">
        <span class="menu-title">Continue <span id="continue-name"></span></span>
        <span id="continue-info" class="small"></span>
        <span class="bar"><i id="continue-bar"></i></span>
      </span>
    </button>

    <nav id="tiles" class="tiles" aria-label="Games"></nav>

    <footer class="foot">
      <p id="ios-hint" class="muted small" hidden>To play offline on iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>.</p>
    </footer>
  </main>

  <!-- GAME (each game renders into its own root inside #play) -->
  <div id="play" hidden></div>

  <div id="pause" class="pause" hidden>
    <div class="pause-box">
      <h2>Paused</h2>
      <p class="muted">Tap anywhere to continue</p>
      <div id="pause-controls" class="pause-controls">
        <span class="muted small">Touch controls</span>
        <div id="pause-schemes" class="seg"></div>
      </div>
      <div class="modal-actions">
        <button id="pause-home" class="pill">Home</button>
        <button id="pause-resume" class="pill primary">Continue</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- MODALS -->
  <dialog id="settings" class="modal">
    <h2>Settings</h2>
    <div class="setting-row">
      <span>Appearance</span>
      <div class="seg" id="theme-seg">
        <button data-theme-opt="system">Auto</button>
        <button data-theme-opt="light">Light</button>
        <button data-theme-opt="dark">Dark</button>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" data-setting="sound"> Sound</label>
    <label class="toggle"><input type="checkbox" data-setting="haptics"> Vibration</label>
    <label class="toggle"><input type="checkbox" id="launch-last"> Open the last game on launch</label>
    <p class="muted small">Everything runs on this device. Progress is saved in this browser only.</p>
    <div class="backup">
      <button id="btn-backup" class="pill">Download backup</button>
      <label class="pill" for="restore-file">Restore backup</label>
      <input type="file" id="restore-file" accept=".json,application/json" hidden>
    </div>
    <div class="modal-actions">
      <button id="settings-close" class="pill primary">Done</button>
    </div>
  </dialog>

  <dialog id="confirm" class="modal">
    <p id="confirm-text" class="pre"></p>
    <div class="modal-actions">
      <button id="confirm-no" class="pill">Cancel</button>
      <button id="confirm-yes" class="pill primary">Yes</button>
    </div>
  </dialog>

  <script src="games/registry.js"></script>
  <script type="module" src="shell.js"></script>
</body>
</html>
