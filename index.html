<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku</title>
  <meta name="description" content="Unlimited sudoku that works offline on any device.">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HOME -->
  <main id="home" class="screen">
    <header class="topbar">
      <h1>Sudoku</h1>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section id="saved" hidden>
      <div class="section-head">
        <h2>In progress</h2>
        <span class="muted"><span id="saved-count"></span> saved</span>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </section>

    <div class="tabs" role="tablist" id="diff-tabs"></div>

    <button id="btn-endless" class="card endless">
      <span class="endless-title">∞ Endless</span>
      <span id="endless-info" class="muted"></span>
    </button>

    <section>
      <div class="section-head">
        <h2>Levels</h2>
        <span id="levels-count" class="muted"></span>
      </div>
      <div id="levels" class="levels"></div>
    </section>

    <footer class="foot">
      <button id="btn-install" class="pill" hidden>Install app</button>
      <p id="ios-hint" class="muted small" hidden>To keep it forever on iPhone: tap <b>Share</b> → <b>Add to Home Screen</b>.</p>
      <p id="offline-status" class="muted small"></p>
    </footer>
  </main>

  <!-- GAME -->
  <main id="game" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="game-title">
        <div id="game-name"></div>
        <div class="muted small"><span id="timer">0:00</span><span id="mistakes-wrap"> · <span id="mistakes">0 mistakes</span></span></div>
      </div>
      <button class="icon-btn" id="btn-restart" aria-label="Restart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>

    <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

    <div class="tools">
      <button class="tool" id="btn-undo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>Undo</span></button>
      <button class="tool" id="btn-erase"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 9"/><path d="M6 11l7 7"/></svg><span>Erase</span></button>
      <button class="tool" id="btn-notes" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Notes <b id="notes-state">off</b></span></button>
      <button class="tool" id="btn-hint"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg><span>Hint</span></button>
    </div>

    <div id="pad" class="pad"></div>
  </main>

  <!-- MODALS -->
  <dialog id="win" class="modal">
    <h2>Solved! 🎉</h2>
    <p id="win-stats" class="muted"></p>
    <div class="modal-actions">
      <button id="win-next" class="pill primary"></button>
      <button id="win-home" class="pill">Home</button>
    </div>
  </dialog>

  <dialog id="settings" class="modal">
    <h2>Settings</h2>
    <label class="toggle"><input type="checkbox" data-setting="showMistakes"> Show mistakes in red</label>
    <label class="toggle"><input type="checkbox" data-setting="highlight"> Highlight row, column, box and same numbers</label>
    <label class="toggle"><input type="checkbox" data-setting="autoNotes"> Remove notes automatically</label>
    <p class="muted small">Everything runs on this device. Progress is saved in this browser only.</p>
    <div class="modal-actions">
      <button id="settings-close" class="pill primary">Done</button>
    </div>
  </dialog>

  <dialog id="confirm" class="modal">
    <p id="confirm-text"></p>
    <div class="modal-actions">
      <button id="confirm-yes" class="pill primary">Yes</button>
      <button id="confirm-no" class="pill">Cancel</button>
    </div>
  </dialog>

  <script src="sudoku.js"></script>
  <script src="levels.js"></script>
  <script src="app.js"></script>
</body>
</html>
