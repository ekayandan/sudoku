name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-games.js
      - run: node tools/check-size.js
      - run: for t in tools/test-*.js; do echo "== $t"; node "$t" || exit 1; done
